<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Cowboy Advance</title>
    <!-- Tints mobile Safari/Chrome's own bars to the bezel brown, so the strips
         above and below the page match the cabinet instead of framing it. -->
    <meta name="theme-color" content="#5e4123" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The cowboy head-shot, regenerated by `just favicon`. -->
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/ui/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/ui/favicon-16.png" />
    <link rel="apple-touch-icon" href="./assets/ui/apple-touch-icon.png" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            /* `100%` resolves against the LARGE viewport on mobile Safari, so
               with `viewport-fit=cover` the bottom of the canvas ends up under
               the browser's toolbar. `100dvh` tracks what is actually visible
               and shrinks as the toolbar appears; the `100%` above it is the
               fallback for browsers without dynamic viewport units. */
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            /* The bezel's own brown (#5e4123, the same value the game clears
               its background camera to). Anything the canvas does not cover —
               notably the safe-area strips a phone leaves top and bottom — then
               matches the frame instead of showing through as sky blue. */
            background: #5e4123;
        }
        /* Bevy's `fit_canvas_to_parent` sizes the drawing buffer to this canvas.
           `touch-action: none` stops the joystick touch from scrolling the page. */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            display: grid;
            place-items: center;
            background: #5e4123;
            opacity: 1;
            visibility: visible;
            transition: opacity 180ms ease-out, visibility 0s linear 180ms;
        }
        #loading-screen.ready {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #loading-runner {
            display: block;
            width: min(80vw, 512px);
            height: auto;
        }
    </style>
</head>
<body>
    <canvas id="bevy-canvas"></canvas>
    <div id="loading-screen" role="status" aria-label="Loading Cowboy Advance">
        <img id="loading-runner" alt="Cowboy galloping on horseback" />
    </div>
    <script type="module">
        /* The js glue and the wasm must come from the same build — each build
           renumbers the glue's function-table exports, so a cached copy of one
           beside a fresh copy of the other throws TypeErrors at startup. Both
           are loaded under build-stamped URLs (build-web.sh writes the stamp)
           so no cache layer can mix builds; the stamp fetch itself bypasses
           the cache. */
        const v = await fetch('./build_id.txt', { cache: 'no-store' })
            .then((r) => (r.ok ? r.text() : 'dev'))
            .catch(() => 'dev');
        document.querySelector('#loading-runner').src = `./assets/ui/loading-cowboy.gif?v=${v}`;
        const { default: init } = await import(`./cowboyadvance.js?v=${v}`);
        await init({ module_or_path: `./cowboyadvance_bg.wasm?v=${v}` });
    </script>
</body>
</html>
